<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="1500" height="900" fill="#fbfaf7"/>
  <text x="750" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">NB1 pod gauge wiring, carrier rev C</text>
  <text x="750" y="58" text-anchor="middle" fill="#555">Car harness → HY2.0-5P → carrier PCB (rear of the pod) → 8-pin header → Waveshare ESP32-S3-Touch-AMOLED-1.75. Two analog sensor inputs on HY2.0-4P.</text>

  <!-- ===== car side ===== -->
  <rect x="30" y="100" width="300" height="250" rx="10" fill="#fff" stroke="#999"/>
  <text x="180" y="126" text-anchor="middle" font-weight="700">Car side (NB1 Miata)</text>
  <g fill="#333">
    <text x="46" y="160">Chassis ground (same point as the ECU)</text>
    <text x="46" y="195">Headlight / parking light +12 V</text>
    <text x="46" y="230">MegaSquirt CAN L  (MSPNP2 DB15 pin 7)</text>
    <text x="46" y="265">MegaSquirt CAN H  (MSPNP2 DB15 pin 6)</text>
    <text x="46" y="300">Ignition-switched +12 V, fused 3 A</text>
    <text x="46" y="335" fill="#777" font-size="12">CAN H/L may land on OBD-II pins 6 and 14 (unused on NB1)</text>
  </g>

  <!-- ===== J2 ===== -->
  <rect x="380" y="130" width="130" height="200" rx="8" fill="#eef3ff" stroke="#5b7fd6"/>
  <text x="445" y="120" text-anchor="middle" font-weight="700">J2  HY2.0-5P</text>
  <g>
    <text x="395" y="164">1  GND</text>
    <text x="395" y="199">2  LIGHTS</text>
    <text x="395" y="234">3  CAN L</text>
    <text x="395" y="269">4  CAN H</text>
    <text x="395" y="304">5  12V_IN</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="330" y1="156" x2="380" y2="160" stroke="#222"/>
    <line x1="330" y1="191" x2="380" y2="195" stroke="#eab308"/>
    <line x1="330" y1="226" x2="380" y2="230" stroke="#0891b2"/>
    <line x1="330" y1="261" x2="380" y2="265" stroke="#1d4ed8"/>
    <line x1="330" y1="296" x2="380" y2="300" stroke="#d62828"/>
  </g>
  <text x="355" y="350" text-anchor="middle" font-size="11" fill="#555">CAN H/L twisted pair</text>

  <!-- ===== carrier PCB as blocks ===== -->
  <rect x="560" y="100" width="560" height="560" rx="12" fill="#eaf5ec" stroke="#2f8f4e"/>
  <text x="840" y="126" text-anchor="middle" font-weight="700">Carrier PCB, Ø46 mm, parts on the rear face</text>

  <!-- power chain -->
  <g font-size="12">
    <rect x="580" y="150" width="90" height="44" rx="6" fill="#fff" stroke="#d62828"/>
    <text x="625" y="168" text-anchor="middle" font-weight="700">F1</text>
    <text x="625" y="184" text-anchor="middle">polyfuse 1.1 A</text>
    <rect x="690" y="150" width="90" height="44" rx="6" fill="#fff" stroke="#e85d04"/>
    <text x="735" y="168" text-anchor="middle" font-weight="700">D1</text>
    <text x="735" y="184" text-anchor="middle">1N5822 reverse</text>
    <rect x="800" y="150" width="90" height="44" rx="6" fill="#fff" stroke="#f48c06"/>
    <text x="845" y="168" text-anchor="middle" font-weight="700">D2 + C1</text>
    <text x="845" y="184" text-anchor="middle">TVS 33 V, 47 µF</text>
    <rect x="910" y="150" width="100" height="44" rx="6" fill="#fff" stroke="#c9184a"/>
    <text x="960" y="168" text-anchor="middle" font-weight="700">U1 + C2</text>
    <text x="960" y="184" text-anchor="middle">TSR 1-2450, 100 µF</text>
    <g stroke="#555" stroke-width="1.5" marker-end="url(#arr)">
      <line x1="670" y1="172" x2="688" y2="172"/>
      <line x1="780" y1="172" x2="798" y2="172"/>
      <line x1="890" y1="172" x2="908" y2="172"/>
    </g>
    <text x="1030" y="176" font-weight="700" fill="#c9184a">5 V out</text>
    <text x="580" y="214" fill="#555">12V_IN → fuse → reverse diode → clamp and bulk → 6.5-36 V in, 5 V 1 A out → header VBUS</text>
  </g>

  <!-- CAN module -->
  <g font-size="12">
    <rect x="580" y="250" width="250" height="110" rx="6" fill="#fff" stroke="#1d4ed8"/>
    <text x="705" y="270" text-anchor="middle" font-weight="700">U2  WCMCU-230 CAN module</text>
    <text x="595" y="292">SN65HVD230, 3.3 V, 1x6 socket</text>
    <text x="595" y="310">CANH / CANL ← J2 pins 4 / 3</text>
    <text x="595" y="328">CTX ← header 4 (GPIO44)</text>
    <text x="595" y="346">CRX → R3 1 kΩ → header 5 (GPIO43)</text>
    <text x="850" y="292" fill="#555">Module has its own 120 Ω</text>
    <text x="850" y="310" fill="#555">termination: this gauge is a</text>
    <text x="850" y="328" fill="#555">bus end, the MS2 side needs</text>
    <text x="850" y="346" fill="#555">its own 120 Ω too.</text>
  </g>

  <!-- headlight -->
  <g font-size="12">
    <rect x="580" y="390" width="250" height="90" rx="6" fill="#fff" stroke="#eab308"/>
    <text x="705" y="410" text-anchor="middle" font-weight="700">Headlight sense</text>
    <text x="595" y="432">LIGHTS (12 V) → R2 2k2 → U3 PC817 LED</text>
    <text x="595" y="450">U3 transistor pulls EX0 low when lit</text>
    <text x="595" y="468">EX0 → J5 wire → Waveshare EX0 test pad</text>
    <text x="850" y="432" fill="#555">J5 also has SDA / SCL pads</text>
    <text x="850" y="450" fill="#555">for a future lux sensor;</text>
    <text x="850" y="468" fill="#555">short wires to the test pads.</text>
  </g>

  <!-- header -->
  <g font-size="12">
    <rect x="580" y="510" width="520" height="130" rx="6" fill="#fff" stroke="#2f8f4e"/>
    <text x="840" y="530" text-anchor="middle" font-weight="700">J1  1x8 long-pin header into the Waveshare socket (pins protrude on the copper side)</text>
    <g font-family="Consolas, monospace" font-size="12">
      <text x="595" y="554">pin  Waveshare   carrier net</text>
      <text x="595" y="571">1    IO18        AIN2         5    TXD/IO43   CAN_RX (via R3 1k)</text>
      <text x="595" y="588">2    IO17        AIN1         6    3V3        3V3 to U2</text>
      <text x="595" y="605">3    IO16        unused       7    GND        GND</text>
      <text x="595" y="622">4    RXD/IO44    CAN_TX       8    VBUS       5V from U1</text>
    </g>
  </g>
  <text x="840" y="652" text-anchor="middle" font-size="11" fill="#b00" font-weight="700">Feed 5 V to VBUS, never 3V3: the Waveshare regulates its own 3.3 V.</text>

  <!-- ===== Waveshare ===== -->
  <rect x="1170" y="100" width="300" height="250" rx="10" fill="#fff" stroke="#999"/>
  <text x="1320" y="126" text-anchor="middle" font-weight="700">Waveshare ESP32-S3-Touch-AMOLED-1.75</text>
  <g font-size="12" fill="#333">
    <text x="1185" y="156">Looking at its back, header at the bottom,</text>
    <text x="1185" y="174">pins left to right:</text>
    <text x="1185" y="198" font-family="Consolas, monospace">IO18 IO17 IO16 RXD TXD 3V3 GND VBUS</text>
    <text x="1185" y="228">Carrier sits behind it on M2 standoffs,</text>
    <text x="1185" y="246">holes match the Waveshare's three.</text>
    <text x="1185" y="276">Console and flashing stay on USB-C.</text>
    <text x="1185" y="300">Test pads EX0 / SDA / SCL: short wires</text>
    <text x="1185" y="318">from J5 on the carrier.</text>
  </g>
  <line x1="1120" y1="575" x2="1170" y2="330" stroke="#2f8f4e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== encoder ===== -->
  <rect x="1170" y="400" width="300" height="190" rx="10" fill="#fff" stroke="#999"/>
  <text x="1320" y="426" text-anchor="middle" font-weight="700">Sensors on J3  HY2.0-4P</text>
  <g font-size="12" fill="#333">
    <text x="1185" y="456">Two extra analog inputs the ECU does not see</text>
    <g font-family="Consolas, monospace">
      <text x="1185" y="482">J3.1  5V      → sender supply (0-5 V senders)</text>
      <text x="1185" y="500">J3.2  GND     → sender ground</text>
      <text x="1185" y="518">J3.3  SENS1   ← sensor 1 signal (GPIO17)</text>
      <text x="1185" y="536">J3.4  SENS2   ← sensor 2 signal (GPIO18)</text>
    </g>
    <text x="1185" y="564">0-5 V sender: bridge open. Resistive sender:</text>
    <text x="1185" y="582">close SJ1/SJ2 (1k pull-up to 5 V). Scaling in firmware.</text>
  </g>
  <line x1="1120" y1="600" x2="1170" y2="500" stroke="#2f8f4e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- arrows car -> J2 -> carrier -->
  <line x1="510" y1="230" x2="560" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== notes ===== -->
  <g font-size="12" fill="#333">
    <text x="30" y="700" font-weight="700" font-size="13">Install notes</text>
    <text x="30" y="722">1. Two-node CAN bus between the MSPNP2 and the gauge, 120 Ω at both ends. The module terminates the gauge end; add a 120 Ω at the MS2 if the MSPNP2 has none.</text>
    <text x="30" y="742">2. Ignition-switched 12 V only. Constant battery (OBD pin 16) would keep the gauge and its hotspot on with the car off.</text>
    <text x="30" y="762">3. Headlight sense takes any 12 V that is present when the lights are on; the dash dimmer feed works too, firmware treats it as on/off.</text>
    <text x="30" y="782">4. Ground the carrier at the same point as the ECU so CAN common-mode stays small.</text>
    <text x="30" y="802">5. Vent the pod: the AMOLED and PMIC are rated to about 60 °C.</text>
    <text x="30" y="822">6. Firmware pin map for this carrier: CAN TX GPIO44, CAN RX GPIO43, analog inputs GPIO17/18, no encoder (hal_board.h, docs/pod-pinout.md).</text>
    <text x="30" y="842">7. Before milling: check your WCMCU-230 pin order against CAN_MODULE_PINS in gen_pcb.py and measure the Waveshare's socket pin 1 end.</text>
  </g>
</svg>
