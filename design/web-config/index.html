<title>NB1 Gauge Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@300;600&display=swap">
<style>
/* Phone-first control panel the gauge will serve from its own Wi-Fi. A fixed
   tab bar at the bottom, one scrolling sheet per tab, controls sized for
   thumbs. Dark by choice: it is used in a car at night. */
:root {
  --bg: #0c0d10; --card: #15181d; --card2: #1b1f26; --line: #272c35;
  --fg: #e9e7e1; --muted: #8c919c; --accent: #38bdf8; --warn: #fbbf24; --bad: #ff3b30; --good: #34d399; --cold: #60a5fa;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --font-gauge: "Montserrat", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; padding-inline: 0; padding-block: 0; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(76px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
header.top h1 { font: 600 17px var(--font-ui); margin: 0; flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.dot.off { background: var(--muted); box-shadow: none; }
.status { font: 500 12px var(--font-mono); color: var(--muted); }
.sheet { display: flex; flex-direction: column; gap: 14px; padding-top: 14px; }
.sheet[hidden] { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { font: 600 11px var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card p.note { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 40px; }
.row label, .row .lab { font-size: 15px; }
.row .sub { color: var(--muted); font-size: 12px; }
select, input[type=number], input[type=text], input[type=password] { background: var(--card2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 500 15px var(--font-ui); min-height: 42px; }
select { max-width: 60vw; }
input[type=number] { width: 86px; font-family: var(--font-mono); text-align: right; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 32px; }
input[type=color] { width: 42px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: none; padding: 0; }
.seg { display: flex; gap: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
.seg button { flex: 1; min-height: 38px; background: transparent; color: var(--muted); border: 0; border-radius: 8px; font: 500 14px var(--font-ui); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #2a303b; color: var(--fg); }
.switch { position: relative; width: 52px; height: 30px; border-radius: 15px; background: #2a303b; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { background: #fff; transform: translateX(22px); }
@media (prefers-reduced-motion: reduce) { .switch::after { transition: none; } }
button.btn { min-height: 42px; background: var(--card2); color: var(--fg); border: 1px solid var(--line); border-radius: 11px; padding: 8px 14px; font: 500 14px var(--font-ui); cursor: pointer; }
button.btn.primary { background: var(--accent); color: #04121a; border-color: var(--accent); }
button.btn.danger { color: var(--bad); border-color: var(--bad); }
button.btn:focus-visible, .switch:focus-visible, .seg button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* live grid */
.live { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.tile { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-left: 4px solid var(--muted); }
.tile .n { font: 600 10px var(--font-ui); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font: 300 26px var(--font-gauge); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .u { font: 400 11px var(--font-mono); color: var(--muted); }
.tile .mm { font: 400 10px var(--font-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; margin-top: 2px; opacity: .85; }
.tile.onscreen { border-color: var(--accent); }
.tile.onscreen .n::after { content: " · screen"; color: var(--accent); letter-spacing: 0; text-transform: none; }

/* layout picker */
.layouts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.layouts button { aspect-ratio: 1; background: var(--card2); border: 2px solid var(--line); border-radius: 50%; padding: 0; cursor: pointer; position: relative; }
.layouts button[aria-pressed="true"] { border-color: var(--accent); }
.layouts svg { width: 100%; height: 100%; display: block; }
.cells { display: flex; flex-direction: column; gap: 8px; }
.cells .row .lab { font: 500 12px var(--font-mono); color: var(--muted); }

/* channel list + zones */
.chlist { display: flex; flex-direction: column; gap: 6px; }
details.ch { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; }
details.ch summary { list-style: none; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; min-height: 44px; }
details.ch summary::-webkit-details-marker { display: none; }
details.ch summary .n { font: 600 14px var(--font-ui); }
details.ch summary .z { display: flex; gap: 3px; }
details.ch summary .z i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
details.ch summary .chev { color: var(--muted); font-size: 12px; }
details.ch[open] summary .chev { transform: rotate(90deg); display: inline-block; }
details.ch .body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.zrow { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 32px; gap: 6px; align-items: center; }
.zrow select { max-width: none; width: 100%; padding: 6px 8px; min-height: 36px; font-size: 13px; }
.zrow input[type=number] { width: 100%; min-height: 36px; padding: 6px 8px; font-size: 13px; }
.zrow button { min-height: 36px; background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.zhead { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 32px; gap: 6px; font: 500 11px var(--font-mono); color: var(--muted); }
.zbar { height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; }
.zbar i { position: absolute; top: 0; bottom: 0; }
.tones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tones label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.tones select { max-width: none; width: 100%; }

/* theme */
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.presets button { background: var(--card2); border: 2px solid var(--line); border-radius: 12px; padding: 8px 4px 6px; cursor: pointer; color: var(--fg); font: 500 12px var(--font-ui); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.presets button[aria-pressed="true"] { border-color: var(--accent); }
.presets .sw { display: flex; gap: 3px; }
.presets .sw i { width: 10px; height: 10px; border-radius: 50%; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.colors label { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.colors label span { display: flex; flex-direction: column; }
.colors code { font: 400 11px var(--font-mono); color: var(--muted); }
.mini { display: block; width: 100%; max-width: 240px; margin: 0 auto; aspect-ratio: 1; border-radius: 50%; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #0f1115; border-top: 1px solid var(--line); display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs button { flex: 1; background: transparent; border: 0; color: var(--muted); font: 500 11px var(--font-ui); padding: 6px 0 4px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-selected="true"] { color: var(--accent); background: #161a22; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--card2); border: 1px solid var(--accent); color: var(--fg); border-radius: 999px; padding: 8px 16px; font-size: 13px; z-index: 20; }
.toast[hidden] { display: none; }
</style>

<div class="wrap">
  <header class="top">
    <span class="dot" id="dot"></span>
    <h1>NB1 Gauge</h1>
    <span class="status" id="status">simulated</span>
  </header>

  <section class="sheet" id="tab-live"></section>
  <section class="sheet" id="tab-screen" hidden></section>
  <section class="sheet" id="tab-channels" hidden></section>
  <section class="sheet" id="tab-theme" hidden></section>
  <section class="sheet" id="tab-alarms" hidden></section>
  <section class="sheet" id="tab-system" hidden></section>
</div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="live" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>Live</button>
  <button role="tab" data-tab="screen" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Screen</button>
  <button role="tab" data-tab="channels" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h10M4 17h13"/></svg>Channels</button>
  <button role="tab" data-tab="theme" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>Theme</button>
  <button role="tab" data-tab="alarms" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg>Alarms</button>
  <button role="tab" data-tab="system" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>System</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script>
// ---------------------------------------------------------------- data model
// Same channel set, zones and theme slots as the firmware config (gauge.json).
const CH = [
  { id:'RPM',    name:'RPM',      kind:'none',  units:'rpm', min:0,    max:8000, dp:0, zones:[[6500,7200,'warn'],[7200,1e9,'bad']] },
  { id:'BOOST',  name:'BOOST',    kind:'press', units:'psi', min:-15,  max:20,   dp:1, zones:[[-1e9,0,'cold'],[12,16,'warn'],[16,1e9,'bad']] },
  { id:'MAP',    name:'MAP',      kind:'none',  units:'kPa', min:0,    max:250,  dp:0, zones:[[185,210,'warn'],[210,1e9,'bad']] },
  { id:'CLT',    name:'COOLANT',  kind:'temp',  units:'°F',  min:100,  max:260,  dp:0, zones:[[-1e9,160,'cold'],[215,230,'warn'],[230,1e9,'bad']] },
  { id:'OILP',   name:'OIL PRES', kind:'press', units:'psi', min:0,    max:100,  dp:0, zones:[[-1e9,10,'bad'],[10,20,'warn'],[80,1e9,'warn']] },
  { id:'OILT',   name:'OIL TEMP', kind:'temp',  units:'°F',  min:100,  max:300,  dp:0, zones:[[-1e9,140,'cold'],[240,260,'warn'],[260,1e9,'bad']] },
  { id:'AFR',    name:'AFR',      kind:'none',  units:'afr', min:10,   max:20,   dp:1, zones:[[-1e9,11,'bad'],[11,12,'warn'],[15.5,17,'warn'],[17,1e9,'bad']] },
  { id:'AFRTGT', name:'AFR TGT',  kind:'none',  units:'afr', min:10,   max:20,   dp:1, zones:[] },
  { id:'EGOCOR', name:'EGO COR',  kind:'none',  units:'%',   min:50,   max:150,  dp:0, zones:[[-1e9,85,'warn'],[115,1e9,'warn']] },
  { id:'MAT',    name:'INTAKE',   kind:'temp',  units:'°F',  min:0,    max:200,  dp:0, zones:[[120,150,'warn'],[150,1e9,'bad']] },
  { id:'EGT',    name:'EGT',      kind:'temp',  units:'°F',  min:400,  max:1800, dp:0, zones:[[1500,1650,'warn'],[1650,1e9,'bad']] },
  { id:'TPS',    name:'THROTTLE', kind:'none',  units:'%',   min:0,    max:100,  dp:0, zones:[] },
  { id:'ADV',    name:'TIMING',   kind:'none',  units:'°',   min:-10,  max:50,   dp:1, zones:[] },
  { id:'PW1',    name:'PULSE W',  kind:'none',  units:'ms',  min:0,    max:25,   dp:2, zones:[] },
  { id:'DUTY',   name:'INJ DUTY', kind:'none',  units:'%',   min:0,    max:100,  dp:0, zones:[[80,90,'warn'],[90,1e9,'bad']] },
  { id:'BATT',   name:'BATTERY',  kind:'none',  units:'V',   min:8,    max:16,   dp:1, zones:[[-1e9,11.5,'bad'],[11.5,12.5,'warn'],[15,15.5,'warn'],[15.5,1e9,'bad']] },
  { id:'KNOCK',  name:'KNOCK',    kind:'none',  units:'°',   min:0,    max:10,   dp:1, zones:[[0.1,2,'warn'],[2,1e9,'bad']] },
  { id:'VSS',    name:'SPEED',    kind:'speed', units:'mph', min:0,    max:160,  dp:0, zones:[] },
  { id:'TCRET',  name:'TC RTD',   kind:'none',  units:'°',   min:0,    max:20,   dp:1, zones:[[0.1,1e9,'warn']] },
  { id:'LAUNCH', name:'LAUNCH',   kind:'none',  units:'°',   min:-20,  max:20,   dp:1, zones:[] },
  { id:'AUX1',   name:'AUX 1',    kind:'none',  units:'V',   min:0,    max:5,    dp:2, zones:[], aux: 1 },
  { id:'AUX2',   name:'AUX 2',    kind:'none',  units:'V',   min:0,    max:5,    dp:2, zones:[], aux: 2 },
];
const AUX_DEFAULT = () => ({ enabled: false, resistive: false, label: 'AUX', units: 'V', decimals: 2, pts: [[0, 0], [5, 5]] });
// Analog input names and units live in cfg.aux; mirror them into the channel table so every tab shows them.
function syncAux() {
  if (!cfg.aux) cfg.aux = { 1: AUX_DEFAULT(), 2: AUX_DEFAULT() };
  for (const c of CH) if (c.aux) { const a = cfg.aux[c.aux] || (cfg.aux[c.aux] = AUX_DEFAULT()); if (!a.label) a.label = 'AUX ' + c.aux; c.name = a.label; c.units = a.units || ''; c.dp = +a.decimals || 0; c.enabled = !!a.enabled; }
}
const chVisible = c => !c.aux || c.enabled;
const byId = Object.fromEntries(CH.map(c => [c.id, c]));
const THEME_KEYS = [['bg','Background'],['digits','Digits'],['label','Labels'],['units','Units, peaks'],['track','Track'],['tick','Ticks, scale'],['neutral','Neutral bar'],['good','Good zone'],['warn','Warning zone'],['bad','Bad zone'],['cold','Cold zone'],['stale','Stale data']];
const PRESETS = {
  Ice:   { bg:'#000000', digits:'#f4f6f8', label:'#8a93a0', units:'#6b737f', track:'#1b1f26', tick:'#5a6270', neutral:'#38bdf8', good:'#34d399', warn:'#fbbf24', bad:'#ff3b30', cold:'#60a5fa', stale:'#4b5058' },
  Ember: { bg:'#000000', digits:'#fff3e0', label:'#9c8a78', units:'#75655a', track:'#221a14', tick:'#6a5a4c', neutral:'#ff8a00', good:'#9ae66e', warn:'#ffd166', bad:'#ff2d55', cold:'#7fb3ff', stale:'#4f463f' },
  Mono:  { bg:'#000000', digits:'#ffffff', label:'#7a7a7a', units:'#5c5c5c', track:'#1c1c1c', tick:'#505050', neutral:'#ffffff', good:'#cfd6d0', warn:'#ffd36b', bad:'#ff5c5c', cold:'#9cc9ff', stale:'#454545' },
  Miata: { bg:'#000000', digits:'#ffffff', label:'#8a7f80', units:'#6a6162', track:'#201617', tick:'#5e5052', neutral:'#e0202a', good:'#35d07f', warn:'#ffb020', bad:'#ff2b2b', cold:'#6ca8ff', stale:'#4a4042' },
  Stock: { bg:'#ece7d4', digits:'#14161a', label:'#1e2024', units:'#4a4c50', track:'#c7cbd0', tick:'#1a1c20', neutral:'#ea3640', good:'#2f9e5b', warn:'#f2a21c', bad:'#f0701e', cold:'#3b7dd8', stale:'#9a9a90' },
};
const TONES = ['off', 'chirp', 'double', 'buzz', 'rising', 'siren'];
const LAYOUTS = [1, 3, 4, 6, 7];
const STYLES = ['ring', 'dial', 'numeric', 'stock'], FILLS = ['gradient', 'segments', 'solid'];

function defaultConfig() {
  const cfg = {
    layout: 1, cells: ['BOOST', 'OILP', 'CLT', 'AFR', 'BATT', 'OILT', 'RPM'], brightness: 80, sim: true, source: 'ms',
    units: { temp_c: false, press_bar: false, speed_kmh: false },
    theme: { preset: 'Ice', style: 'ring', fill: 'gradient', bands: true, digit_scale: 1, label_scale: 1, cell_scale: 1, units_scale: 1, minmax_scale: 1, bar_scale: 1, rgb: { ...PRESETS.Ice } },
    alarms: { volume: 60, warn_on: true, bad_on: true, mute: false, repeat_s: 10, tone_warn: {}, tone_bad: {} },
    channels: {},
    wifi: { ssid: 'NB1-Gauge-3F2A', password: 'miata2000', timeout_min: 0, on: true },
    theme_presets: [],   // user colour presets: { name, rgb }
    screens: [],         // saved screens: { name, layout, cells, theme }
    aux: { 1: Object.assign(AUX_DEFAULT(), { label: 'AUX 1' }), 2: Object.assign(AUX_DEFAULT(), { label: 'AUX 2' }) },
  };
  for (const c of CH) {
    cfg.channels[c.id] = { min: c.min, max: c.max, zones: c.zones.map(z => [...z]), show_units: true, show_min: true, show_max: true };
    cfg.alarms.tone_warn[c.id] = c.zones.length ? 'chirp' : 'off';
    cfg.alarms.tone_bad[c.id]  = c.zones.length ? 'double' : 'off';
  }
  Object.assign(cfg.alarms.tone_bad, { OILP: 'siren', KNOCK: 'siren', EGT: 'siren', RPM: 'buzz' });
  cfg.alarms.tone_warn.EGOCOR = 'off';
  return cfg;
}

// ---------------------------------------------------------------- API
// On the gauge, /api/config and /api/state are served by the ESP32. In this
// preview a mock answers instead, kept in your browser.
let cfg = defaultConfig();
let live = {}, connected = false;
const mock = {
  async getConfig() { try { const s = JSON.parse(localStorage.getItem('nb1.webcfg') || 'null'); if (s && s.channels) return s; } catch (e) {} return defaultConfig(); },
  async putConfig(c) { try { localStorage.setItem('nb1.webcfg', JSON.stringify(c)); } catch (e) {} return { ok: true }; },
  async getState() { return { values: engine(performance.now() / 1000), screen: cfg.cells.slice(0, cfg.layout) }; },
  async action(name) { return { ok: true, name }; },
};
const real = {
  async getConfig() { return (await fetch('/api/config')).json(); },
  async putConfig(c) { return (await fetch('/api/config', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(c) })).json(); },
  async getState() { return (await fetch('/api/state')).json(); },
  async action(name, body) { return (await fetch('/api/' + name, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })).json(); },
};
// Embedded in the gauge preview page: talk to it over postMessage so the
// phone drives the gauge beside it, the way the real page drives the gauge.
const embedded = window.parent !== window;
const pending = {}; let seq = 0;
const frame = {
  call(type, body) { return new Promise(res => { const id = ++seq; pending[id] = res; window.parent.postMessage({ nb1: true, id, type, body }, '*'); setTimeout(() => { if (pending[id]) { delete pending[id]; res(null); } }, 2000); }); },
  getConfig() { return this.call('getConfig'); },
  putConfig(c) { return this.call('putConfig', c); },
  getState() { return this.call('getState'); },
  action(name, body) { return this.call('action', { name, ...(body || {}) }); },
};
window.addEventListener('message', e => { const m = e.data; if (!m || !m.nb1 || !pending[m.id]) return; pending[m.id](m.result); delete pending[m.id]; });
let api = mock;
async function connect() {
  if (embedded) { api = frame; connected = true; }
  else { try { const r = await fetch('/api/config', { signal: AbortSignal.timeout(1500) }); if (r.ok) { api = real; connected = true; } } catch (e) {} }
  cfg = (await api.getConfig()) || defaultConfig();
  document.getElementById('dot').classList.toggle('off', !connected);
  document.getElementById('status').textContent = embedded ? 'linked to gauge' : connected ? 'connected · ' + location.host : 'simulated';
}
// When the gauge side changes a setting, pick it up (only while idle, so an
// edit in progress is never clobbered).
// Pick up changes made on the gauge itself (its menu, or the linked preview).
// Only when the gauge's own copy changed since we last saw it, and never
// while a field is focused, so a page rebuild cannot steal the keyboard.
let lastCfgJson = '';
const editing = () => ['INPUT', 'SELECT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
async function syncFromGauge() {
  if (!embedded && !connected) return;
  try {
    const fresh = await api.getConfig();
